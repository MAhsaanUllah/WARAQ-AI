# Waraq AI — Qdrant (self-hosted vector DB)
# Run: docker compose up -d
# API: http://localhost:6333 | Dashboard: http://localhost:6333/dashboard
name: waraq
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: waraq-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (used by the async client)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_data:
