[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waraq-ai"
version = "0.1.0"
description = "Waraq AI — production-grade RAG engine: hybrid retrieval + cross-encoder reranking + deterministic page-level citations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # API framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",          # multipart uploads (/api/upload-doc)
    # Config + logging
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Vector store
    "qdrant-client>=1.10",              # AsyncQdrantClient
    # PDF parsing (page + bbox metadata for citations)
    "pymupdf>=1.24",
    # Embeddings — local dense (bge-small-en-v1.5) + sparse (SPLADE)
    "fastembed>=0.3",
    # Reranking — ONNX, no torch in base install
    "flashrank>=0.2",
    # LLM access (BYOK: deepseek / gemini / openai / anthropic)
    "litellm>=1.40",
    "httpx>=0.27",
    # Auth (Clerk JWT verification)
    "clerk-backend-api>=7.0",
    # Rate Limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Heavier cross-encoder reranker (torch). Optional — keeps base install lean.
reranker = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
